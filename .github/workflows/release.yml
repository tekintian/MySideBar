name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! printf '%s' "$TAG" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '${TAG}' is not a semver release tag like v1.2.3"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=${TAG} version=${VERSION}"

      - name: Build archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          grep -q "__version__ = '${VERSION}'" src/meta.py \
            || { echo "src/meta.py __version__ != ${VERSION}"; exit 1; }
          head -n 1 src/messages/install.txt | grep -q "MySideBar ${VERSION}" \
            || { echo "src/messages/install.txt != ${VERSION}"; exit 1; }
          test "$(cat src/.python-version)" = "3.8"
          test -f src/.no-sublime-package
          test -f src/README.md
          test -f src/README_CN.md
          grep -q "(./README_CN.md)" src/README.md \
            || { echo "src/README.md must link ./README_CN.md"; exit 1; }
          grep -q "(./README.md)" src/README_CN.md \
            || { echo "src/README_CN.md must link ./README.md"; exit 1; }
          grep -q "This is the release copy" src/README.md \
            || { echo "src/README.md must carry the release-copy notice"; exit 1; }
          grep -q "本文档是发布副本" src/README_CN.md \
            || { echo "src/README_CN.md must carry the release-copy notice"; exit 1; }
          mkdir -p dist
          (cd src && zip -qr "../dist/MySideBar-${VERSION}.zip" . -x "*.DS_Store" "*/__pycache__/*")
          unzip -l "dist/MySideBar-${VERSION}.zip"
          unzip -Z1 "dist/MySideBar-${VERSION}.zip" | grep -qx "MySideBar.py" \
            || { echo "archive is nested, MySideBar.py must sit at the zip root"; exit 1; }
          unzip -Z1 "dist/MySideBar-${VERSION}.zip" | grep -qx "README.md" \
            || { echo "README.md missing from archive"; exit 1; }
          (cd dist && sha256sum "MySideBar-${VERSION}.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/MySideBar-*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/MySideBar-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

  sync-main:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          path: dev

      - name: Download archive hashes
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: "${{ runner.temp }}/dist"

      - name: Mirror src/ into main
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          printf '%s' "$TAG" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::tag '${TAG}' is not a semver release tag"; exit 1; }
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          SHA=$(cut -d' ' -f1 "${RUNNER_TEMP}/dist/SHA256SUMS.txt")
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S')
          SRC_SHA=$(git -C dev rev-parse --short HEAD)
          test -e dev/src/MySideBar.py || { echo "dev/src/MySideBar.py missing"; exit 1; }
          test "$(grep -c "__version__ = '${VERSION}'" dev/src/meta.py)" = "1" \
            || { echo "dev/src/meta.py __version__ != ${VERSION}"; exit 1; }

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p main && cd main
          git init -q -b main .
          git remote add origin "https://github.com/${REPO}.git"

          cp -R ../dev/src/. .
          rm -f packages.json
          rm -f .DS_Store
          find . -type d -name "__pycache__" -not -path "./.git/*" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -not -path "./.git/*" -delete 2>/dev/null || true
          test ! -d mysidebar/__pycache__ || { echo "__pycache__ still present"; exit 1; }

          python3 - "$VERSION" "$SHA" "$DATE" "$REPO" <<'PY'
          import json
          import sys

          version, digest, date, repo = sys.argv[1:5]
          payload = {
              "schema_version": "4.0.0",
              "packages": [
                  {
                      "name": "MySideBar",
                      "details": "https://github.com/%s/blob/main/packages.json" % repo,
                      "labels": ["sidebar", "encoding", "file management", "i18n"],
                      "releases": [
                          {
                              "sublime_text": ">=4000",
                              "platforms": ["*"],
                              "version": version,
                              "url": "https://github.com/%s/releases/download/%s/MySideBar-%s.zip" % (repo, version, version),
                              "date": date,
                              "sha256": digest,
                          }
                      ],
                  }
              ],
              "libraries": [],
          }
          with open("packages.json", "w", encoding="utf-8") as fp:
              json.dump(payload, fp, indent=4)
              fp.write("\n")
          PY

          git add -A
          git status --short | head -n 60

          for required in MySideBar.py meta.py messages.json README.md README_CN.md .no-sublime-package .python-version packages.json; do
            test -e "$required" || { echo "$required missing in main tree"; exit 1; }
          done
          test ! -e src || { echo "src/ nesting leaked into main"; exit 1; }
          test ! -e mysidebar/__pycache__ || { echo "__pycache__ leaked into main"; exit 1; }
          git ls-files | grep -E "(__pycache__|\.pyc$|\.DS_Store)" && { echo "ignored artifacts tracked"; exit 1; } || true
          python3 -c "import json; json.load(open('packages.json'))"

          git commit -q -m "release: ${VERSION} (dev ${SRC_SHA})"
          git push --force origin HEAD:main
          echo "main synced from dev@${SRC_SHA} at ${VERSION}"